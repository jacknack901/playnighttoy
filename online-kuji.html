<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>頑夜 TOY｜線上抽賞</title>
<meta name="description" content="頑夜 TOY 線上抽賞：選套、付款、選號、由店家代抽並查看結果。">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#0d0a13;color:#f4f1f8}a{color:inherit}
.top{position:sticky;top:0;z-index:30;background:rgba(13,10,19,.94);backdrop-filter:blur(12px);border-bottom:1px solid #2e263a}.topIn{max-width:1120px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:10px}.brand{font-weight:1000;font-size:18px}.sp{flex:1}.top a{padding:8px 11px;border:1px solid #3b3149;border-radius:9px;text-decoration:none;font-size:12px}
.hero{max-width:1120px;margin:0 auto;padding:28px 16px 16px}.hero h1{font-size:30px;margin:0 0 7px}.hero p{margin:0;color:#b7adc3;line-height:1.6}.notice{margin-top:14px;padding:11px 12px;border:1px solid #69562e;background:#21190d;border-radius:12px;color:#f0d084;font-size:12px;line-height:1.6}
.wrap{max-width:1120px;margin:auto;padding:0 16px 40px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:12px 0}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer;background:#7b42d6;color:#fff}.btn.secondary{background:#211a2b;border:1px solid #443653}.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid #30263d;border-radius:15px;background:#14101c;overflow:hidden}.cover{aspect-ratio:16/9;background:#201928;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.name{font-size:15px;font-weight:1000;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.stat{background:#1b1524;border-radius:9px;padding:7px;text-align:center}.stat b{display:block}.stat span{color:#9489a0;font-size:9px}.source{font-size:10px;color:#b0a4bc;margin:7px 0}.source.warn{color:#efc96f}.prizes{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.prizes span{font-size:9px;background:#221a2d;border-radius:7px;padding:4px 6px}
.draws{display:flex;gap:6px;flex-wrap:wrap}.drawBtn{border:1px solid #4b3c5e;background:#18121f;color:#f4f1f8;border-radius:8px;padding:7px 9px;font-weight:900;cursor:pointer}.drawBtn.active{background:#7b42d6;border-color:#7b42d6}.cardActions{display:flex;gap:7px;margin-top:10px}.cardActions .btn{flex:1}.empty{padding:30px;text-align:center;color:#9c91a8;border:1px dashed #41344e;border-radius:14px}
.sectionBox{margin-top:18px;border:1px solid #30263d;border-radius:15px;background:#14101c;padding:14px}.sectionBox h2{margin:0 0 10px}label{display:block;font-size:11px;color:#b1a5bd;margin:9px 0 4px}input,textarea,select{width:100%;border:1px solid #443653;background:#0f0b15;color:#fff;border-radius:9px;padding:10px;font:inherit}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}.hidden{display:none!important}.orderSummary{padding:10px;border-radius:10px;background:#1b1524;margin:9px 0;font-size:12px;line-height:1.6}.statusTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.statusBadge{padding:5px 8px;border-radius:999px;background:#2b2137;font-size:10px;font-weight:900}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:12px 0}.step{padding:6px 4px;text-align:center;border-radius:8px;background:#1b1524;color:#776c82;font-size:8px}.step.on{background:#40276a;color:#fff}.bank{padding:10px;border-radius:10px;background:#101820;border:1px solid #283b49;margin:10px 0}.bank b{font-size:16px;letter-spacing:.5px}
.numbers{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:10px}.num{border:1px solid #493a5a;background:#17121e;color:#fff;border-radius:7px;padding:7px 2px;text-align:center;cursor:pointer;font-weight:900}.num.sel{background:#7b42d6;border-color:#7b42d6}.resultGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.result{padding:9px;border:1px solid #3c3049;border-radius:9px;background:#181220}.result b{display:block}.muted{color:#9b90a7;font-size:11px}.error{color:#ff9d9d;margin-top:8px;font-size:11px}.success{color:#9ce9b7;margin-top:8px;font-size:11px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.steps{grid-template-columns:repeat(3,1fr)}.numbers{grid-template-columns:repeat(8,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.formGrid{grid-template-columns:1fr}.full{grid-column:auto}.numbers{grid-template-columns:repeat(5,1fr)}.resultGrid{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style>
</head>
<body>
<header class="top"><div class="topIn"><div class="brand">頑夜 TOY｜線上抽賞</div><div class="sp"></div><a href="./index.html">官網</a><a href="./shop.html">商城</a></div></header>
<section class="hero"><h1>線上選號，由頑夜幫你代抽</h1><p>先選想抽的套組與抽數，管理員確認最新賞況後再付款。付款完成後開放選號，由頑夜實際代抽並把結果同步回這裡。</p><div class="notice">賞況可能因其他玩家同時抽取而變動；付款前以管理員確認為準。來源賞況過期時系統會暫停接單。</div></section>
<main class="wrap">
<div class="toolbar"><strong>目前可抽套組</strong><button class="btn secondary" onclick="loadSets()">重新整理</button></div>
<div id="setGrid" class="grid"><div class="empty" style="grid-column:1/-1">載入中…</div></div>

<section id="requestBox" class="sectionBox hidden">
<h2>送出抽賞申請</h2><div id="requestSummary" class="orderSummary"></div>
<div class="formGrid"><div><label>姓名 *</label><input id="reqName"></div><div><label>手機 *</label><input id="reqPhone" inputmode="tel"></div><div class="full"><label>LINE ID *</label><input id="reqLine"></div><div class="full"><label>備註</label><textarea id="reqNote" rows="2"></textarea></div></div>
<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="reqSubmit" onclick="submitRequest()">送出給管理員確認</button><button class="btn secondary" onclick="closeRequest()">取消</button></div><div id="reqMsg"></div>
</section>

<section class="sectionBox"><h2>查詢我的抽賞進度</h2><div style="display:flex;gap:7px"><input id="trackToken" placeholder="輸入訂單查詢碼"><button class="btn" onclick="trackOrder()">查詢</button></div><div class="muted" style="margin-top:6px">送出申請後會取得一組查詢碼；請保留該頁面或查詢碼。</div></section>
<section id="statusBox" class="sectionBox hidden"><div class="statusTop"><div><h2 id="statusName" style="margin:0"></h2><div id="statusId" class="muted"></div></div><span id="statusBadge" class="statusBadge"></span></div><div id="statusSteps" class="steps"></div><div id="statusMain"></div></section>
</main>
<script src="./config.js?v=27180"></script><script src="./gas-bridge.js?v=27180"></script>
<script>
var SETS=[],ACTIVE_SET=null,ACTIVE_DRAW=0,CURRENT_TOKEN='',POLL=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(v){return 'NT$'+Math.round(Number(v||0)).toLocaleString();}
function msg(id,text,ok){var x=document.getElementById(id);x.className=ok?'success':'error';x.textContent=text||'';}
function loadSets(){document.getElementById('setGrid').innerHTML='<div class="empty" style="grid-column:1/-1">載入中…</div>';google.script.run.withSuccessHandler(function(r){SETS=(r&&r.items)||[];renderSets();}).withFailureHandler(function(e){document.getElementById('setGrid').innerHTML='<div class="empty" style="grid-column:1/-1">載入失敗：'+esc((e&&e.message)||'')+'</div>';}).getPublicOnlineKujiListV27180();}
function renderSets(){var g=document.getElementById('setGrid');if(!SETS.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">目前沒有開放中的線上抽賞。</div>';return;}g.innerHTML=SETS.map(function(x){var src=x.sourceLinked?(Number.isFinite(Number(x.sourceAgeMinutes))?'賞況 '+Math.floor(Number(x.sourceAgeMinutes))+' 分鐘前':'賞況已連結'):'店內賞池';if(!x.canOrder)src='⚠ '+(x.pauseReason||'暫停接單');var options=(x.drawOptions||[]).map(function(n){return '<button class="drawBtn" data-set="'+esc(x.id)+'" data-draw="'+n+'" onclick="pickDraw(this)">'+n+' 抽</button>';}).join('');var prizes=(x.prizes||[]).slice(0,6).map(function(p){return '<span>'+esc(p.grade)+' '+Number(p.remainingQty||0)+'/'+Number(p.originalQty||0)+'</span>';}).join('');return '<article class="card"><div class="cover">'+(x.imageUrl?'<img src="'+esc(x.imageUrl)+'" alt="">':'')+'</div><div class="body"><div class="name">'+esc(x.name)+'</div><div class="stats"><div class="stat"><b>'+money(x.price)+'</b><span>一抽</span></div><div class="stat"><b>'+Number(x.remaining||0)+'</b><span>可接抽數</span></div><div class="stat"><b>'+Number(x.majorRemaining||0)+'</b><span>大賞剩餘</span></div></div><div class="source '+(!x.canOrder?'warn':'')+'">'+esc(src)+'</div>'+(prizes?'<div class="prizes">'+prizes+'</div>':'')+(x.description?'<div class="muted">'+esc(x.description)+'</div>':'')+'<div class="draws">'+(options||'<span class="muted">目前沒有可選抽數</span>')+'</div><div class="cardActions"><button class="btn" '+(!x.canOrder?'disabled':'')+' onclick="openRequest(\''+esc(x.id)+'\')">我要抽</button></div></div></article>';}).join('');}
function pickDraw(b){document.querySelectorAll('.drawBtn').forEach(function(x){x.classList.remove('active');});b.classList.add('active');ACTIVE_DRAW=Number(b.getAttribute('data-draw')||0);ACTIVE_SET=SETS.find(function(x){return x.id===b.getAttribute('data-set');})||null;}
function openRequest(id){var s=SETS.find(function(x){return x.id===id;});if(!s||!s.canOrder)return;ACTIVE_SET=s;if(!ACTIVE_DRAW||!(s.drawOptions||[]).includes(ACTIVE_DRAW))ACTIVE_DRAW=(s.drawOptions||[])[0]||0;if(!ACTIVE_DRAW)return alert('目前沒有可選抽數。');document.getElementById('requestSummary').innerHTML='<b>'+esc(s.name)+'</b><br>'+ACTIVE_DRAW+' 抽 × '+money(s.price)+' ＝ <b>'+money(s.price*ACTIVE_DRAW)+'</b>';document.getElementById('requestBox').classList.remove('hidden');document.getElementById('requestBox').scrollIntoView({behavior:'smooth',block:'start'});}
function closeRequest(){document.getElementById('requestBox').classList.add('hidden');}
function submitRequest(){if(!ACTIVE_SET||!ACTIVE_DRAW)return;var b=document.getElementById('reqSubmit');b.disabled=true;msg('reqMsg','送出中…',true);google.script.run.withSuccessHandler(function(r){b.disabled=false;msg('reqMsg','申請已送出，查詢碼：'+r.token,true);CURRENT_TOKEN=r.token;document.getElementById('trackToken').value=r.token;history.replaceState(null,'','?order='+encodeURIComponent(r.token));closeRequest();trackOrder();}).withFailureHandler(function(e){b.disabled=false;msg('reqMsg',(e&&e.message)||'送出失敗',false);}).submitOnlineKujiRequestV27180({settingId:ACTIVE_SET.id,drawCount:ACTIVE_DRAW,name:document.getElementById('reqName').value,phone:document.getElementById('reqPhone').value,lineId:document.getElementById('reqLine').value,note:document.getElementById('reqNote').value});}
function trackOrder(){var t=String(document.getElementById('trackToken').value||CURRENT_TOKEN||'').trim().toUpperCase();if(!t)return alert('請輸入查詢碼。');CURRENT_TOKEN=t;document.getElementById('trackToken').value=t;google.script.run.withSuccessHandler(function(r){renderOrder(r&&r.order);startPoll();}).withFailureHandler(function(e){alert((e&&e.message)||'查詢失敗');}).getPublicOnlineKujiOrderV27180(t);}
function stage(s){var a=['待管理員確認','待付款','待確認付款','已付款待選號','已選號待代抽','開獎完成'],i=a.indexOf(s);return i<0?0:i;}
function bankHtml(o){if(!o.bank)return '';return '<div class="bank"><div class="muted">匯款帳號</div><b>'+esc(o.bank.bank)+'（'+esc(o.bank.code)+'） '+esc(o.bank.account)+'</b><div class="muted">請匯款 '+money(o.total)+'，完成後回報後五碼。</div></div>';}
function numberPicker(o){var p=Number(o.numberPoolSize||0),w=Number(o.drawCount||0),sel=(o.selectedNumbers||[]).slice(),h='<div class="orderSummary">請從 1～'+p+' 選擇 <b>'+w+'</b> 個號碼。<br><span id="pickCount">已選 '+sel.length+'/'+w+'</span></div><div class="numbers">';for(var i=1;i<=p;i++)h+='<button class="num '+(sel.indexOf(i)>=0?'sel':'')+'" data-n="'+i+'" onclick="toggleNum(this,'+w+')">'+i+'</button>';return h+'</div><button class="btn" style="margin-top:10px" onclick="submitNumbers('+w+')">確認送出選號</button>';}
function renderOrder(o){if(!o)return;document.getElementById('statusBox').classList.remove('hidden');document.getElementById('statusName').textContent=o.kujiName;document.getElementById('statusId').textContent=o.orderId+'｜查詢碼 '+o.token;document.getElementById('statusBadge').textContent=o.status;var labels=['申請','付款','核款','選號','代抽','完成'],idx=stage(o.status);document.getElementById('statusSteps').innerHTML=labels.map(function(x,i){return '<div class="step '+(i<=idx?'on':'')+'">'+x+'</div>';}).join('');var h='<div class="orderSummary">'+o.drawCount+' 抽｜'+money(o.unitPrice)+'/抽｜應付 <b>'+money(o.total)+'</b></div>';if(o.status==='待管理員確認')h+='<div class="muted">管理員正在確認最新賞況。確認可以接單後，這裡會顯示付款資訊。</div>';if(o.status==='待付款')h+=bankHtml(o)+'<div class="formGrid"><div><label>匯款後五碼</label><input id="payLast5" maxlength="5" inputmode="numeric"></div><div><label>實際匯款金額</label><input id="payAmount" type="number" value="'+Number(o.total||0)+'"></div></div><button class="btn" style="margin-top:9px" onclick="reportPayment()">我已完成匯款</button>';if(o.status==='待確認付款')h+=bankHtml(o)+'<div class="muted">已收到付款回報，等待管理員核對。</div>';if(o.status==='已付款待選號')h+=numberPicker(o);if(o.status==='已選號待代抽')h+='<div class="orderSummary">你選的號碼：<b>'+esc((o.selectedNumbers||[]).join('、'))+'</b></div><div class="muted">頑夜正在依照你的號碼進行代抽。</div>';if(o.status==='開獎完成')h+='<h3>🎉 開獎完成</h3><div class="resultGrid">'+(o.results||[]).map(function(r){return '<div class="result"><b>'+r.number+' 號｜'+esc(r.grade)+'</b><span>'+esc(r.name||'')+'</span></div>';}).join('')+'</div>';if(o.status==='已取消')h+='<div class="error">這筆訂單已取消，如有付款問題請聯繫官方 LINE。</div>';document.getElementById('statusMain').innerHTML=h;document.getElementById('statusBox').scrollIntoView({behavior:'smooth',block:'start'});}
function toggleNum(b,w){var s=document.querySelectorAll('.num.sel');if(b.classList.contains('sel'))b.classList.remove('sel');else{if(s.length>=w)return alert('最多只能選 '+w+' 個號碼。');b.classList.add('sel');}document.getElementById('pickCount').textContent='已選 '+document.querySelectorAll('.num.sel').length+'/'+w;}
function reportPayment(){google.script.run.withSuccessHandler(trackOrder).withFailureHandler(function(e){alert((e&&e.message)||'送出失敗');}).submitOnlineKujiPaymentV27180(CURRENT_TOKEN,{last5:document.getElementById('payLast5').value,amount:document.getElementById('payAmount').value});}
function submitNumbers(w){var n=Array.from(document.querySelectorAll('.num.sel')).map(function(b){return Number(b.getAttribute('data-n'));});if(n.length!==w)return alert('請選滿 '+w+' 個號碼。');if(!confirm('確認送出？\\n'+n.join('、')))return;google.script.run.withSuccessHandler(trackOrder).withFailureHandler(function(e){alert((e&&e.message)||'送出失敗');}).submitOnlineKujiNumbersV27180(CURRENT_TOKEN,{numbers:n});}
function startPoll(){if(POLL)clearInterval(POLL);POLL=setInterval(function(){if(CURRENT_TOKEN)google.script.run.withSuccessHandler(function(r){renderOrder(r&&r.order);}).withFailureHandler(function(){}).getPublicOnlineKujiOrderV27180(CURRENT_TOKEN);},15000);}
(function(){loadSets();try{var t=new URL(location.href).searchParams.get('order');if(t){CURRENT_TOKEN=t.toUpperCase();document.getElementById('trackToken').value=CURRENT_TOKEN;trackOrder();}}catch(e){}})();
</script>
</body></html>
