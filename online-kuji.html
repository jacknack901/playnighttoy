<header class="top"><div class="topIn"><img class="brandLogo" src="./assets/logo.png" alt="頑夜 TOY"><div class="brand"><strong>頑夜 TOY｜線上抽賞</strong><small>選號開抽</small></div><div class="sp"></div><a href="./index.html">官網</a><a href="./shop.html">商城</a></div></header>
<section class="hero"><div class="heroShell"><h1>選你喜歡的號碼，直接開抽</h1><p>挑一套想抽的商品，選抽數、選籤號後送出申請。已經開出的籤會直接顯示賞別，還沒開的號碼都能自己挑。</p><div class="howSteps"><div class="howStep"><b>1</b><span>選套組</span></div><div class="howStep"><b>2</b><span>選抽數</span></div><div class="howStep"><b>3</b><span>挑籤號</span></div><div class="howStep"><b>4</b><span>送出申請</span></div></div></div></section>
<main class="wrap">
<div class="toolbar"><div><strong>正在開放的抽賞</strong><small>選一套開始挑號碼</small></div><button class="btn secondary" id="refreshBtn" onclick="loadSets(true)">更新籤況</button></div>
<div id="syncState" class="sync"></div><div id="setGrid" class="grid"><div class="empty" style="grid-column:1/-1">載入中…</div></div>
<section id="purchaseBox" class="section purchaseSection hidden">
  <div class="sectionHead"><div><h2 id="purchaseName">選號開抽</h2><div id="purchaseMeta" class="purchaseQuickMeta"></div></div><button class="btn secondary" onclick="closePurchase()">關閉</button></div>
  <div id="purchasePrizeSummary"></div>
  <div class="flowBlock"><div class="flowTitle"><span class="num">1</span><div><b>選擇抽數</b><small>想抽幾次？</small></div></div><div class="drawRow" id="purchaseDraws"></div></div>
  <div class="flowBlock"><div class="flowTitle"><span class="num">2</span><div><b>挑選籤號</b><small id="pickCount">已選 0 / 0</small></div><div class="legend"><span><i></i>可選</span><span class="lSel"><i></i>你的選號</span><span class="lOpen"><i></i>已開獎</span><span class="lRes"><i></i>已保留</span></div></div><div id="purchaseBoard" class="ticketBoard"></div></div>
  <div class="orderSummary" id="purchaseSummary"></div>
  <div class="flowBlock"><div class="flowTitle"><span class="num">3</span><div><b>填寫聯絡資料</b><small>送出後會取得查詢碼</small></div></div><div class="formGrid"><div><label>姓名 *</label><input id="reqName" placeholder="收件／聯絡姓名"></div><div><label>手機 *</label><input id="reqPhone" inputmode="tel" placeholder="09xxxxxxxx"></div><div class="full"><label>LINE ID *</label><input id="reqLine" placeholder="方便通知付款與開獎"></div><div class="full"><label>備註</label><textarea id="reqNote" rows="2" placeholder="沒有可留空"></textarea></div></div><button class="btn" id="reqSubmit" style="margin-top:11px;width:100%" onclick="submitRequest()">確認送出抽賞申請</button><div id="reqMsg"></div></div>
</section>

var SETS=[],ACTIVE_SET=null,ACTIVE_DRAW=0,SELECTED=[],CURRENT_TOKEN='',POLL=null,BOARD_POLL=null,SET_LOADING=false,CACHE_KEY='wanye-online-kuji-27262',CACHE_MS=24*60*60*1000,PUBLIC_REVISION='';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function gradeToneClass(v){var g=String(v||'').trim().toUpperCase().replace(/賞/g,'');var m=g.match(/[A-Z]/);var c=m?m[0]:'';if(c==='A')return 'gradeA';if(c==='B')return 'gradeB';if(c==='C')return 'gradeC';if(c==='D')return 'gradeD';return 'gradeMinor';}
function money(v){return 'NT$'+Math.round(Number(v||0)).toLocaleString();}
function setMsg(id,text,ok){var x=document.getElementById(id);x.className=text?'message '+(ok?'ok':'bad'):'';x.textContent=text||'';}
function imgTag(x,cls,alt){var src=x&&x.imageUrl?x.imageUrl:'',fb=x&&x.imageFallbackUrl?x.imageFallbackUrl:'';if(!src)return '<div class="muted">暫無圖片</div>';return '<img '+(cls?'class="'+cls+'" ':'')+'src="'+esc(src)+'" alt="'+esc(alt||'')+'" loading="lazy" decoding="async" onload="if(this.classList.contains(\'coverMain\'))fitCoverImage(this)" onerror="if(this.dataset.fb!==\'1\'&&\''+esc(fb)+'\'){this.dataset.fb=\'1\';this.src=\''+esc(fb)+'\';}else{this.style.display=\'none\';}">';}
function fitCoverImage(img){if(!img)return;var w=Number(img.naturalWidth||0),h=Number(img.naturalHeight||0);if(!w||!h)return;var r=w/h;img.classList.toggle('squarePreview',r>=.92&&r<=1.08);}
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({t:Date.now(),items:SETS}));}catch(e){}}
function readCache(){try{var x=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(x&&Array.isArray(x.items)&&Date.now()-Number(x.t||0)<CACHE_MS)return x.items;}catch(e){}return null;}
function loadSets(force,silent){
  if(SET_LOADING)return;
  var g=document.getElementById('setGrid'),state=document.getElementById('syncState'),btn=document.getElementById('refreshBtn');
  if(!force&&!SETS.length){
    var c=readCache();
    if(c){SETS=c;renderSets();if(state)state.textContent='';}
    else g.innerHTML='<div class="empty" style="grid-column:1/-1">載入中…</div>';
  }
  SET_LOADING=true;
  if(btn&&!silent){btn.disabled=true;btn.textContent='更新中…';}
  var start=Date.now(),previousSelected=SELECTED.slice();
  google.script.run.withSuccessHandler(function(r){
    SET_LOADING=false;
    SETS=(r&&r.items)||[];PUBLIC_REVISION=String(r&&r.revision||PUBLIC_REVISION||'');saveCache();renderSets();
    if(ACTIVE_SET){
      var fresh=SETS.find(function(x){return x.id===ACTIVE_SET.id;});
      if(fresh){
        ACTIVE_SET=fresh;
        var openMap={};(fresh.board||[]).forEach(function(x){openMap[Number(x.number)]=x.status;});
        SELECTED=SELECTED.filter(function(n){return openMap[n]==='未開';});
        renderPurchase();
        if(previousSelected.length!==SELECTED.length)setMsg('reqMsg','籤況剛剛有更新，已移除已被開出或已被其他人選走的號碼。',false);
      }
    }
    if(state)state.textContent='';
    if(btn&&!silent){btn.disabled=false;btn.textContent='更新籤況';}
  }).withFailureHandler(function(e){
    SET_LOADING=false;
    if(!SETS.length)g.innerHTML='<div class="empty" style="grid-column:1/-1">載入失敗：'+esc((e&&e.message)||'未知錯誤')+'</div>';
    if(state&&!silent)state.textContent='';
    if(btn&&!silent){btn.disabled=false;btn.textContent='更新籤況';}
  }).getPublicOnlineKujiListV27180();
}
function loadOnlineKujiStaticV27263_(){
  return fetch('./online-kuji-bootstrap.json?v=27263',{method:'GET',cache:'no-store',credentials:'same-origin'})
    .then(function(res){if(!res.ok)throw new Error('bootstrap '+res.status);return res.json();})
    .then(function(data){
      var items=data&&Array.isArray(data.items)?data.items:[];
      if(!items.length)throw new Error('bootstrap empty');
      SETS=items;
      PUBLIC_REVISION=String(data.revision||PUBLIC_REVISION||'');
      saveCache();
      renderSets();
      return items.length;
    })
    .catch(function(){return 0;});
}
function primeOnlineKujiV27263_(){
  var cached=readCache();
  if(cached&&cached.length){
    SETS=cached;
    renderSets();
  }
  loadOnlineKujiStaticV27263_().then(function(count){
    // GitHub 快照只負責秒開；真正送單仍由 Apps Script 鎖內重新驗證。
    setTimeout(function(){if(!SET_LOADING)loadSets(true,true);},count?900:120);
  });
}
function prizeSummary(x,compact){var arr=(x.prizes||[]),show=compact?arr.slice(0,4):arr,ps=show.map(function(p){return '<div class="prize"><div class="pimg">'+imgTag(p,'',p.grade)+'</div><div class="pgrade '+gradeToneClass(p.grade)+'">'+esc(p.grade||'獎賞')+'</div><div class="pname">'+esc(p.name||'')+'</div><div class="qty">剩 '+Number(p.remainingQty||0)+' / '+Number(p.originalQty||0)+'</div></div>';}).join('');var more=compact&&arr.length>show.length?'<div class="muted" style="grid-column:1/-1;text-align:center;padding:4px 0">另有 '+Number(arr.length-show.length)+' 種獎賞，點進去查看完整內容</div>':'';return '<div class="prizeBox '+(compact?'compact':'')+'"><div class="prizeHead"><b>'+(compact?'主要獎賞':'獎賞一覽')+'</b><span>'+Number(arr.length)+' 種</span></div><div class="prizeGrid">'+ps+more+'</div></div>';}
function publicDesc(x){var d=String(x&&x.description||'').trim();if(!d)return '';if(/付款(前|確認後)|管理員|代抽|同步結果|開放選號/.test(d))return '';return d;}
function renderSets(){var g=document.getElementById('setGrid');if(!SETS.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">目前沒有開放中的線上抽賞。</div>';return;}g.innerHTML=SETS.map(function(x){var canView=!!x.canViewBoard||!!x.canOrder;var desc=publicDesc(x);var status=x.pauseReason?'<div class="stateLine"><span class="pill warn">'+esc(x.pauseReason)+'</span></div>':'';var label=x.canOrder?'選號開抽':(canView?'查看籤盤':'暫停開放');return '<article class="card"><div class="cover">'+imgTag(x,'coverMain',x.name)+'</div><div class="body"><div class="name">'+esc(x.name)+'</div><div class="stats"><div class="stat"><b>'+money(x.price)+'</b><span>每抽</span></div><div class="stat"><b>'+Number(x.remaining||0)+'</b><span>可選號碼</span></div><div class="stat"><b>'+Number(x.openedCount||0)+'</b><span>已開獎</span></div></div>'+status+'<div class="arrivalLine"><span>📦</span><div><div class="arrivalLabel">預計到貨</div><strong>'+esc(x.arrivalText||'待公告')+'</strong></div></div>'+prizeSummary(x,true)+(desc?'<div class="desc">'+esc(desc)+'</div>':'')+'<div class="cardActions"><button class="btn" '+(!canView?'disabled':'')+' onclick="openPurchase(\''+esc(x.id)+'\')">'+label+'</button></div></div></article>';}).join('');}
function checkBoardRevision(){
  if(!ACTIVE_SET||document.visibilityState==='hidden'||SET_LOADING)return;
  google.script.run.withSuccessHandler(function(r){
    var rev=String(r&&r.revision||'');
    if(rev&&PUBLIC_REVISION&&rev===PUBLIC_REVISION)return;
    if(rev)PUBLIC_REVISION=rev;
    loadSets(true,true);
  }).withFailureHandler(function(){}).getPublicOnlineKujiOrderV27180('__REVISION__');
}
function startBoardAutoSync(){if(BOARD_POLL)clearInterval(BOARD_POLL);BOARD_POLL=setInterval(checkBoardRevision,8000);}
function stopBoardAutoSync(){if(BOARD_POLL){clearInterval(BOARD_POLL);BOARD_POLL=null;}}
function openPurchase(id){var s=SETS.find(function(x){return x.id===id;});if(!s||!(s.canViewBoard||s.canOrder))return;ACTIVE_SET=s;ACTIVE_DRAW=(s.drawOptions||[])[0]||0;SELECTED=[];setMsg('reqMsg',s.canOrder?'':(s.orderBlockedReason||s.pauseReason||'目前只能查看籤盤，尚未開放送單。'),false);renderPurchase();document.getElementById('purchaseBox').classList.remove('hidden');document.getElementById('purchaseBox').scrollIntoView({behavior:'smooth',block:'start'});startBoardAutoSync();setTimeout(checkBoardRevision,250);}
function closePurchase(){document.getElementById('purchaseBox').classList.add('hidden');ACTIVE_SET=null;ACTIVE_DRAW=0;SELECTED=[];stopBoardAutoSync();}
function setDraw(n){ACTIVE_DRAW=Number(n||0);SELECTED=[];renderPurchase();}
function toggleTicket(n){if(!ACTIVE_SET||!ACTIVE_DRAW)return;if(!ACTIVE_SET.canOrder){setMsg('reqMsg',ACTIVE_SET.orderBlockedReason||ACTIVE_SET.pauseReason||'目前尚未開放選號送單。',false);return;}var i=SELECTED.indexOf(n);if(i>=0)SELECTED.splice(i,1);else{if(SELECTED.length>=ACTIVE_DRAW)return;SELECTED.push(n);SELECTED.sort(function(a,b){return a-b;});}renderPurchaseBoard();renderPurchaseSummary();}
function renderPurchase(){if(!ACTIVE_SET)return;document.getElementById('purchaseName').textContent=ACTIVE_SET.name;document.getElementById('purchaseMeta').innerHTML='<span>'+money(ACTIVE_SET.price)+' / 抽</span><span>'+Number(ACTIVE_SET.remaining||0)+' 個號碼可選</span><span>'+Number(ACTIVE_SET.openedCount||0)+' 個已開</span><span class="arrival">📦 '+esc(ACTIVE_SET.arrivalText||'到貨時間待公告')+'</span>';document.getElementById('purchasePrizeSummary').innerHTML=prizeSummary(ACTIVE_SET,false);document.getElementById('purchaseDraws').innerHTML=(ACTIVE_SET.drawOptions||[]).map(function(n){return '<button class="drawBtn '+(Number(n)===Number(ACTIVE_DRAW)?'active':'')+'" onclick="setDraw('+Number(n)+')">'+Number(n)+' 抽</button>';}).join('');renderPurchaseBoard();renderPurchaseSummary();}
function renderPurchaseSummary(){if(!ACTIVE_SET)return;document.getElementById('pickCount').textContent='已選 '+SELECTED.length+' / '+ACTIVE_DRAW;var block=!ACTIVE_SET.canOrder?(ACTIVE_SET.orderBlockedReason||ACTIVE_SET.pauseReason||'目前暫停抽賞'):'',warn=block?'<div style="margin-top:5px;color:#a06d1f;font-size:9px;font-weight:900">'+esc(block)+'</div>':(ACTIVE_SET.needsConfirm?'<div style="margin-top:5px;color:#8b6e25;font-size:9px">送出後會先確認最新賞況，再通知付款。</div>':'');var picked=SELECTED.length?('籤號 '+SELECTED.join('、')):('請選 '+ACTIVE_DRAW+' 個號碼');document.getElementById('purchaseSummary').innerHTML='<div><div class="sumMain">本次 '+ACTIVE_DRAW+' 抽 · '+money(ACTIVE_DRAW*ACTIVE_SET.price)+'</div><div class="sumSub">'+picked+'</div>'+warn+'</div>';document.getElementById('reqSubmit').disabled=!ACTIVE_SET.canOrder||SELECTED.length!==ACTIVE_DRAW;document.getElementById('reqSubmit').textContent=ACTIVE_SET.canOrder?'確認送出抽賞申請':'目前暫停抽賞';}
function renderPurchaseBoard(){
  if(!ACTIVE_SET)return;
  var b=document.getElementById('purchaseBoard'),board=(ACTIVE_SET.board||[]);
  if(!board.length){b.innerHTML='<div class="empty" style="grid-column:1/-1">籤盤尚未建立。</div>';return;}
  b.innerHTML=board.map(function(x){
    var n=Number(x.number||0),sel=SELECTED.indexOf(n)>=0,grade=String(x.grade||'已開').replace(/賞$/,'');
    if(x.status==='已開'){
      return '<div class="ticketSlot isOpened"><button class="ticket opened" disabled title="'+esc((x.grade||'已開')+' '+(x.name||''))+'"><span class="ticketFace"><strong class="openedGrade '+gradeToneClass(x.grade)+'">'+esc(grade)+'</strong><span class="openedName">'+esc(x.name||'')+'</span><span class="openedStamp">已開</span></span></button><div class="ticketNo">'+n+'</div></div>';
    }
    if(x.status==='保留'){
      return '<div class="ticketSlot isReserved"><button class="ticket reserved" disabled title="這個號碼目前已被其他訂單保留"><span class="ticketFace"><strong class="reserveText">已被選</strong><span class="reserveSub">不可選擇</span></span></button><div class="ticketNo">'+n+'</div></div>';
    }
    return '<div class="ticketSlot '+(sel?'isSelected':'')+'"><button class="ticket '+(sel?'selected':'available')+'" '+(ACTIVE_SET.canOrder?'':'disabled')+' onclick="toggleTicket('+n+')" aria-label="'+n+' 號 '+(ACTIVE_SET.canOrder?(sel?'已選擇':'可選擇'):'目前僅供查看')+'"><span class="ticketFace"><span class="ticketMark"><img src="./assets/logo.png" alt=""><span>'+(sel?'已選擇':(ACTIVE_SET.canOrder?'頑夜 TOY':'待開放'))+'</span></span></span></button><div class="ticketNo">'+n+'</div></div>';
  }).join('');
}
function submitRequest(){if(!ACTIVE_SET||!ACTIVE_DRAW)return;if(!ACTIVE_SET.canOrder)return setMsg('reqMsg',ACTIVE_SET.orderBlockedReason||ACTIVE_SET.pauseReason||'目前尚未開放送單。',false);if(SELECTED.length!==ACTIVE_DRAW)return setMsg('reqMsg','請先選滿 '+ACTIVE_DRAW+' 個籤號。',false);var btn=document.getElementById('reqSubmit');btn.disabled=true;btn.textContent='送出中…';setMsg('reqMsg','正在保留你選的籤號…',true);var chosen=SELECTED.slice();google.script.run.withSuccessHandler(function(r){btn.disabled=false;btn.textContent='確認送出抽賞申請';CURRENT_TOKEN=r.token;document.getElementById('trackToken').value=r.token;history.replaceState(null,'','?order='+encodeURIComponent(r.token));setMsg('reqMsg','申請已送出，查詢碼：'+r.token,true);var local=SETS.find(function(x){return x.id===ACTIVE_SET.id;});if(local){(local.board||[]).forEach(function(x){if(chosen.indexOf(Number(x.number))>=0)x.status='保留';});local.reservedCount=Number(local.reservedCount||0)+chosen.length;local.remaining=Math.max(0,Number(local.remaining||0)-chosen.length);saveCache();renderSets();}closePurchase();trackOrder();setTimeout(function(){loadSets(true,true);},600);}).withFailureHandler(function(e){btn.disabled=false;btn.textContent='確認送出抽賞申請';setMsg('reqMsg',(e&&e.message)||'送出失敗',false);loadSets(true);}).submitOnlineKujiRequestV27180({settingId:ACTIVE_SET.id,drawCount:ACTIVE_DRAW,selectedNumbers:chosen,name:document.getElementById('reqName').value,phone:document.getElementById('reqPhone').value,lineId:document.getElementById('reqLine').value,note:document.getElementById('reqNote').value});}
function stage(s){var a=['待管理員確認','待付款','待確認付款','已選號待代抽','開獎完成'];if(s==='已付款待選號')return 2;var i=a.indexOf(s);return i<0?0:i;}
function stepHtml(status){var names=['管理員確認','付款','核帳','代抽','完成'],i=stage(status);return names.map(function(n,k){return '<div class="step '+(k<=i?'on':'')+'">'+n+'</div>';}).join('');}
function bankHtml(o){if(!o.bank)return '';return '<div class="bank"><div class="muted">匯款帳號</div><b>'+esc(o.bank.bank)+'（'+esc(o.bank.code)+'） '+esc(o.bank.account)+'</b><div class="muted">應付 '+money(o.total)+'，匯款後回報後五碼。</div></div>';}
function resultHtml(o){if(!o.results||!o.results.length)return '<div class="muted">尚未登記開獎結果。</div>';return '<div class="results">'+o.results.map(function(r){return '<div class="result"><div class="resultImg">'+imgTag(r,'',r.grade)+'</div><div><b class="'+gradeToneClass(r.grade)+'">'+Number(r.number||0)+' 號｜'+esc(r.grade||'')+'</b><span>'+esc(r.name||'')+'</span></div></div>';}).join('')+'</div>';}
function renderOrder(o){if(!o)return;document.getElementById('statusBox').classList.remove('hidden');document.getElementById('statusName').textContent=o.kujiName||'線上抽賞';document.getElementById('statusId').textContent='查詢碼 '+(o.token||'')+'｜'+Number(o.drawCount||0)+' 抽｜'+money(o.total);document.getElementById('statusBadge').textContent=o.status||'';document.getElementById('statusSteps').innerHTML=stepHtml(o.status);var nums=(o.selectedNumbers||[]);var h='<div class="summary">訂單 '+esc(o.orderId||'')+'<br>你選的籤號：<b>'+esc(nums.join('、'))+'</b><br>目前狀態：<b>'+esc(o.status||'')+'</b></div>';if(o.status==='待管理員確認')h+='<div class="muted">籤號已替你保留，等待管理員確認最新賞況。</div>';else if(o.status==='待付款')h+=bankHtml(o)+'<div class="formGrid"><div><label>匯款後五碼</label><input id="payLast5" inputmode="numeric" maxlength="5"></div><div><label>實際匯款金額</label><input id="payAmount" inputmode="numeric" value="'+Number(o.total||0)+'"></div></div><button class="btn" style="margin-top:10px" onclick="reportPayment()">回報已匯款</button>';else if(o.status==='待確認付款')h+='<div class="muted">已收到付款回報，等待管理員核帳。</div>';else if(o.status==='已付款待選號')h+='<div class="muted">舊版訂單需要再選一次號碼，請重新整理後依畫面操作。</div>';else if(o.status==='已選號待代抽')h+='<div class="muted">付款已確認，等待頑夜代抽並登記結果。</div>';else if(o.status==='開獎完成')h+='<div class="summary"><b>🎉 開獎完成</b><br>以下是本次實際中獎結果。</div>'+resultHtml(o);else if(o.status==='已取消')h+='<div class="message bad">這筆訂單已取消。'+(o.note?' '+esc(o.note):'')+'</div>';document.getElementById('statusMain').innerHTML=h;document.getElementById('statusBox').scrollIntoView({behavior:'smooth',block:'start'});}
function trackOrder(){var t=String(document.getElementById('trackToken').value||CURRENT_TOKEN||'').trim().toUpperCase();if(!t)return alert('請輸入查詢碼。');CURRENT_TOKEN=t;document.getElementById('trackToken').value=t;google.script.run.withSuccessHandler(function(r){renderOrder(r&&r.order);startPoll();}).withFailureHandler(function(e){alert((e&&e.message)||'查詢失敗');}).getPublicOnlineKujiOrderV27180(t);}
function reportPayment(){google.script.run.withSuccessHandler(function(){trackOrder();}).withFailureHandler(function(e){alert((e&&e.message)||'送出失敗');}).submitOnlineKujiPaymentV27180(CURRENT_TOKEN,{last5:document.getElementById('payLast5').value,amount:document.getElementById('payAmount').value});}
function startPoll(){if(POLL)clearInterval(POLL);POLL=setInterval(function(){if(CURRENT_TOKEN)google.script.run.withSuccessHandler(function(r){renderOrder(r&&r.order);}).withFailureHandler(function(){}).getPublicOnlineKujiOrderV27180(CURRENT_TOKEN);},12000);}
(function(){primeOnlineKujiV27263_();setInterval(function(){if(!ACTIVE_SET&&document.visibilityState!=='hidden'&&!SET_LOADING)loadSets(true,true);},90000);document.addEventListener('visibilitychange',function(){if(!document.hidden&&!ACTIVE_SET&&!SET_LOADING)setTimeout(function(){loadSets(true,true);},500);});try{var t=new URL(location.href).searchParams.get('order');if(t){CURRENT_TOKEN=t.toUpperCase();document.getElementById('trackToken').value=CURRENT_TOKEN;trackOrder();}}catch(e){}})();
